<!-- ════════════════ PAGE: SONGS ════════════════ -->
<div class="page" id="page-songs">
    <div class="page-search-bar">
        <div class="search-input-wrap">
            <span style="color:var(--text-muted)"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input id="songs-search" oninput="searchSongs('songs-search')" type="text"
                data-i18n="songs.search_placeholder" data-i18n-attr="placeholder" placeholder="Tìm bài hát, nghệ sĩ...">
        </div>
        <button class="btn btn-outline" onclick="searchSongs('songs-search')"><i class="fa-solid fa-filter"></i>
            <span data-i18n="songs.filter">Lọc</span></button>
        <button class="btn btn-primary" onclick="openAddSongModal()">
            <i class="fa-solid fa-plus"></i> <span data-i18n="songs.add">Thêm bài hát</span>
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-music"></i> <span data-i18n="songs.all">Tất cả bài hát</span></span>
            <span class="card-action" id="songs-count"></span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="songs.col_plays">Lượt phát</th>
                        <th data-i18n="songs.col_song">Bài hát</th>
                        <th data-i18n="songs.col_duration">Thời lượng</th>
                        <th data-i18n="songs.col_actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="songs-tbody"></tbody>
            </table>
        </div>
        <div class="pagination" id="songs-pagination"></div>
    </div>
</div>
