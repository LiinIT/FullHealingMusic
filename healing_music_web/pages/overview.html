<!-- ════════════════ PAGE: OVERVIEW ════════════════ -->
<div class="page active" id="page-overview">
    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-icon"><i class="fa-solid fa-music"></i></span>
            <div class="stat-label" data-i18n="ov.total_songs">TỔNG BÀI HÁT</div>
            <div class="stat-value"><span id="total-songs-value"></span></div>
            <div class="stat-meta">
                <span class="stat-badge up"><i class="fa-solid fa-arrow-trend-up"></i></span>
                <span data-i18n="ov.total_songs_meta">tổng bài hát</span>
            </div>
        </div>
        <div class="stat-card">
            <span class="stat-icon"><i class="fa-solid fa-microphone-lines"></i></span>
            <div class="stat-label" data-i18n="ov.artists">NGHỆ SĨ</div>
            <div class="stat-value" id="total-artist-value"></div>
            <div class="stat-meta">
                <span class="stat-badge up"><i class="fa-solid fa-user-plus"></i></span>
                <span data-i18n="ov.artists_meta">nghệ sĩ</span>
            </div>
        </div>
        <div class="stat-card">
            <span class="stat-icon"><i class="fa-solid fa-users"></i></span>
            <div class="stat-label" data-i18n="ov.active_users">NGƯỜI DÙNG</div>
            <div class="stat-value" id="total-user-value"></div>
            <div class="stat-meta">
                <span class="stat-badge up"><i class="fa-solid fa-arrow-trend-up"></i></span>
                <span data-i18n="ov.users_meta">người dùng đăng ký</span>
            </div>
        </div>
        <div class="stat-card">
            <span class="stat-icon"><i class="fa-brands fa-deezer"></i></span>
            <div class="stat-label" data-i18n="ov.total_plays">TỔNG LƯỢT PHÁT</div>
            <div class="stat-value" id="total-plays"></div>
            <div class="stat-meta">
                <span class="stat-badge up"><i class="fa-solid fa-arrow-trend-up"></i></span>
                <span data-i18n="ov.plays_meta">tổng lượt phát</span>
            </div>
        </div>
    </div>

    <!-- Search bar -->
    <div class="overview-search-wrap">
        <div class="topbar-search" style="width:100%;max-width:420px;">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="overview-search-input" data-i18n="ov.search_placeholder" data-i18n-attr="placeholder" placeholder="Tìm kiếm bài hát, nghệ sĩ, người dùng...">
        </div>
    </div>

    <!-- Content Grid -->
    <div class="content-grid">
        <!-- Left: Charts + Top Tracks -->
        <div style="display:flex;flex-direction:column;gap:20px">
            <!-- Play Count Chart -->
            <div class="card" id="streams-chart">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-chart-bar"></i> <span data-i18n="ov.top_songs_chart">Top bài hát theo lượt phát</span></span>
                </div>
                <div class="mini-chart">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Lượt phát</div>
                    <div class="mini-chart-bars"></div>
                    <div class="mini-chart-labels"></div>
                </div>
            </div>

            <!-- Top Tracks -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-fire"></i> <span data-i18n="ov.top_tracks">Top Bài Hát</span></span>
                    <span class="card-action" onclick="navigate('songs')"><span data-i18n="ov.see_all">Xem tất cả</span> <i class="fa-solid fa-arrow-right"></i></span>
                </div>
                <div class="track-list" id="top-tracks"></div>
            </div>
        </div>

        <!-- Right: Player + Activity -->
        <div style="display:flex;flex-direction:column;gap:16px">
            <!-- Now Playing -->
            <div class="now-playing">
                <div class="now-playing-label"><i class="fa-solid fa-headphones-simple"></i> <span data-i18n="ov.now_playing">ĐANG PHÁT</span></div>
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
                    <img id="np-image" src="" width="56" height="56"
                        style="border-radius:10px;object-fit:cover;display:none;flex-shrink:0;">
                    <div>
                        <div class="now-playing-title" id="np-title">—</div>
                        <div class="now-playing-artist" id="np-artist">—</div>
                    </div>
                </div>
                <div class="progress-bar-wrap" onclick="seekTrack(event)">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="shuffle-btn" onclick="PLAYER.toggleShuffle()" title="Shuffle">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="ctrl-btn" onclick="prevTrack()">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button class="ctrl-btn main" id="play-btn" onclick="togglePlay()">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="ctrl-btn" onclick="nextTrack()">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button class="ctrl-btn" id="repeat-btn" onclick="PLAYER.toggleRepeat()" title="Repeat">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                    <span class="time-info">
                        <span id="current-time">0:00</span> / <span id="np-duration">—</span>
                    </span>
                </div>
            </div>

            <!-- Activity Feed -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-bolt"></i> <span data-i18n="ov.activity">Hoạt động gần đây</span></span>
                </div>
                <div class="activity-list" id="activity-feed"></div>
            </div>

            <!-- Artists section (hiện khi search) -->
            <div class="card" id="overview-artists-card" style="display:none">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-microphone-lines"></i> Artists</span>
                </div>
                <div id="overview-artists-list"></div>
            </div>

            <!-- Users section (hiện khi search) -->
            <div class="card" id="overview-users-card" style="display:none">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-users"></i> Users</span>
                </div>
                <div id="overview-users-list"></div>
            </div>
        </div>
    </div>
</div>
