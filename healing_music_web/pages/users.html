<!-- ════════════════ PAGE: USERS ════════════════ -->
<div class="page" id="page-users">
    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-users"></i> <span data-i18n="users.title">Người dùng</span></div>
        <button class="btn btn-primary" onclick="openModal('modal-add-user');">
            <i class="fa-solid fa-user-plus"></i> <span data-i18n="users.invite">Mời người dùng</span>
        </button>
    </div>
    <div class="card" style="margin-bottom:24px">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="users.col_user">Người dùng</th>
                        <th data-i18n="users.col_email">Email</th>
                        <th data-i18n="users.col_role">Vai trò</th>
                        <th data-i18n="users.col_actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
        <div class="pagination" id="users-pagination"></div>
    </div>

    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-list-ul"></i> <span data-i18n="users.playlists">Danh sách phát</span></div>
    </div>
    <div class="card">
        <div class="playlist-grid" id="playlists-grid"></div>
        <div class="pagination" id="playlists-pagination"></div>
    </div>
</div>
