<!-- ════════════════ PAGE: USERS ════════════════ -->
<div class="page" id="page-users">
    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-users"></i> Users</div>
        <button class="btn btn-primary" onclick="openModal('modal-add-user');">
            <i class="fa-solid fa-user-plus"></i> Invite User
        </button>
    </div>
    <div class="card" style="margin-bottom:24px">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
        <div class="pagination" id="users-pagination"></div>
    </div>

    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-list-ul"></i> Playlists</div>
    </div>
    <div class="card">
        <div class="playlist-grid" id="playlists-grid"></div>
        <div class="pagination" id="playlists-pagination"></div>
    </div>
</div>
