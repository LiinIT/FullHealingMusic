<!-- ════════════════ PAGE: ARTISTS ════════════════ -->
<div class="page" id="page-artists">
    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-microphone-lines"></i> <span data-i18n="artists.title">Nghệ sĩ</span></div>
        <button class="btn btn-primary" onclick="openModal('modal-add-artist')">
            <i class="fa-solid fa-plus"></i> <span data-i18n="artists.add">Thêm nghệ sĩ</span>
        </button>
    </div>
    <div class="card" style="margin-bottom:24px">
        <div class="artist-grid" id="artists-grid"></div>
        <div class="pagination" id="artists-pagination"></div>
    </div>

    <div class="section-row">
        <div class="section-title"><i class="fa-solid fa-compact-disc"></i> <span data-i18n="artists.albums">Album</span></div>
        <button class="btn btn-outline" onclick="openAddAlbum()">
            <i class="fa-solid fa-plus"></i> <span data-i18n="artists.add_album">Thêm album</span>
        </button>
    </div>
    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="artists.col_album">Album</th>
                        <th data-i18n="artists.col_artist">Nghệ sĩ</th>
                        <th data-i18n="artists.col_tracks">Bài</th>
                        <th data-i18n="artists.col_plays">Lượt phát</th>
                        <th data-i18n="artists.col_actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="albums-tbody"></tbody>
            </table>
        </div>
        <div class="pagination" id="albums-pagination"></div>
    </div>
</div>
