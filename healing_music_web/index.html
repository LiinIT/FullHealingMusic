<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
    <title>Healing Music — Admin Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- Login Screen -->
    <div class="login-screen" id="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-headphones-simple"></i>
            </div>
            <div class="login-title">Healing Music</div>
            <div class="login-subtitle">Admin Dashboard</div>

            <div class="login-form">
                <div class="login-field">
                    <label>Username</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input id="login-username" type="text" placeholder="Nhập tên đăng nhập"
                            onkeydown="if(event.key==='Enter') doLogin()">
                    </div>
                </div>
                <div class="login-field">
                    <label>Password</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input id="login-password" type="password" placeholder="Nhập mật khẩu"
                            onkeydown="if(event.key==='Enter') doLogin()">
                        <button class="login-eye" type="button" onclick="toggleLoginPassword(this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="login-error" id="login-error"></div>
                <button class="login-btn" id="login-btn" onclick="doLogin()">
                    <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                </button>
            </div>
        </div>
    </div>

    <div class="app-layout" id="app-layout" style="display:none">
        <!-- Sidebar sẽ được load vào đây -->
        <div id="sidebar-container"></div>

        <div class="main-content">
            <!-- Topbar sẽ được load vào đây -->
            <div id="topbar-container"></div>

            <!-- Page content -->
            <main class="page-content">
                <div id="page-container"></div>
            </main>
        </div>
    </div>


    <!-- Modals container -->
    <div id="modals-container"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/render-overview.js"></script>
    <script src="js/render-songs.js"></script>
    <script src="js/render-artists.js"></script>
    <script src="js/render-users.js"></script>
    <script src="js/render-notifications.js"></script>
    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/handleFile.js"></script>
    <script src="js/html-loader.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
